<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yardage Test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito+Sans:wght@400;600;700&family=Architects+Daughter&display=swap">
<style>
  :root { --cream:#FFFDD0; --paper:#F7F1DC; --pine:#184027; --tan:#E3B278; --card:rgb(248,200,158); --putt:#A6D48A; --red:#C0392B;
    --body:'Nunito Sans','Segoe UI',system-ui,sans-serif; --num:'Bebas Neue','Arial Narrow',Impact,sans-serif; --hand:'Architects Daughter','Segoe Print',cursive; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--pine); color: var(--cream); font-family: var(--body); font-size: 16px; line-height: 1.4; overflow: hidden; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }
  .app { position: relative; height: 100%; display: flex; flex-direction: column; }
  .hdr { flex: none; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hdr .t { font-family: var(--num); font-size: 22px; letter-spacing: .5px; text-transform: uppercase; }
  .chip { font-family: var(--num); font-size: 14px; letter-spacing: .6px; padding: 5px 12px; border-radius: 300px; background: rgba(243,239,199,.14); border: 1px solid rgba(243,239,199,.22); white-space: nowrap; }
  .chip.good { background: var(--putt); color: var(--pine); border-color: transparent; }
  .chip.ok { background: var(--tan); color: var(--pine); border-color: transparent; }
  .chip.bad { background: var(--red); color: var(--cream); border-color: transparent; }
  .mapwrap { position: relative; flex: 1 1 0; min-height: 0; }
  #map { position: absolute; inset: 0; background: #2E4A34; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(255,253,208,.75) !important; color: #34342F; }
  .leaflet-control-zoom { display: none; }
  .me-dot { width: 18px; height: 18px; border-radius: 300px; background: var(--pine); border: 3px solid var(--cream); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin { width: 16px; height: 16px; border-radius: 300px; background: var(--cream); border: 2.5px solid var(--pine); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.mark { background: var(--tan); }
  .hint { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-family: var(--hand); font-size: 15px; color: var(--cream); text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; z-index: 500; }
  .follow { position: absolute; right: 14px; top: 42px; z-index: 500; }
  .follow button { flex: none; padding: 8px 14px; font-size: 14px; background: rgba(24,64,39,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .yard { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 500; border-radius: 22px; padding: 12px 18px; background: rgba(248,200,158,.94); color: var(--pine); border: 1px solid rgba(24,64,39,.14); box-shadow: 0 10px 30px rgba(24,64,39,.35); display: flex; align-items: center; gap: 14px; }
  .yard .big { font-family: var(--num); font-size: 64px; line-height: 60px; min-width: 96px; }
  .yard .lbl { font-family: var(--num); font-size: 12px; letter-spacing: 1.1px; text-transform: uppercase; color: #5B3D17; }
  .yard .fb { margin-left: auto; text-align: right; font-size: 13px; line-height: 18px; }
  .yard .fb b { font-family: var(--num); font-weight: 400; font-size: 20px; letter-spacing: .3px; }
  .bar { flex: none; display: flex; gap: 8px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  button { flex: 1 1 0; font: inherit; font-family: var(--num); font-size: 16px; letter-spacing: .8px; text-transform: uppercase; color: var(--cream); background: rgba(243,239,199,.14); border: 1px solid rgba(243,239,199,.22); border-radius: 300px; padding: 13px 0; cursor: pointer; }
  button.primary { background: linear-gradient(135deg, rgba(240,216,170,.95), rgba(222,184,128,.92)); color: var(--pine); border-color: transparent; }
  button.on { background: var(--putt); color: var(--pine); border-color: transparent; }
  button:disabled { opacity: .4; }
  button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
  .log { flex: none; max-height: 92px; overflow-y: auto; padding: 0 16px 8px; font-size: 12px; color: rgba(243,239,199,.75); font-variant-numeric: tabular-nums; }
  .log div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(243,239,199,.1); }
  .gate { position: absolute; inset: 0; background: var(--pine); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 14px; z-index: 1000; }
  .gate p { max-width: 34ch; margin: 0; color: rgba(243,239,199,.85); }
  .gate .t { font-family: var(--num); font-size: 34px; letter-spacing: .5px; }
  .gate button { flex: none; padding: 14px 34px; }
  .gate .err { color: var(--tan); font-size: 14px; max-width: 36ch; }
</style>
</head>
<body>
<div class="app">
  <div class="gate" id="gate">
    <div class="t">Yardage test</div>
    <p>Your dot, live, on the satellite photo. Tap anything — a tree, a mailbox, the far goal line — for the yards to it. Mark a spot, walk away, and check the number against something you know.</p>
    <button class="primary" id="start">Start · allow location</button>
    <div class="err" id="err"></div>
  </div>
  <div class="hdr">
    <div class="t">Yardage test</div>
    <span class="chip" id="acc">waiting for GPS</span>
  </div>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="hint" id="hint">tap anything for yards to it</div>
    <div class="follow"><button id="followbtn" class="on">Follow me</button></div>
    <div class="yard">
      <div><div class="big" id="big">—</div><div class="lbl" id="biglbl">tap the map</div></div>
      <div class="fb" id="fb"><b>—</b> from mark<br><b>—</b> bearing</div>
    </div>
  </div>
  <div class="bar">
    <button id="markbtn" disabled>Mark here</button>
    <button id="clearbtn" disabled>Clear</button>
    <button id="unitbtn">Yards</button>
  </div>
  <div class="log" id="log"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const M_PER_YD = 0.9144;
  let unit = 'yd', me = null, target = null, mark = null, follow = true, started = false;
  const fmt = m => unit === 'yd' ? Math.round(m / M_PER_YD) : Math.round(m);
  const compass = b => ['N','NE','E','SE','S','SW','W','NW'][Math.round(b / 45) % 8];
  const bearing = (a, b) => { const e = (b.lng - a.lng) * Math.cos(a.lat * Math.PI / 180), n = b.lat - a.lat; return (Math.atan2(e, n) * 180 / Math.PI + 360) % 360; };

  const map = L.map('map', { zoomControl: false, attributionControl: true, tap: false }).setView([39.5, -98.5], 4);
  // Satellite: Esri World Imagery (sharp, to street level). Public-domain USGS as the fallback.
  const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' });
  esri.addTo(map);
  esri.on('tileerror', () => { if (!map.hasLayer(usgs)) { map.removeLayer(esri); usgs.addTo(map); } });
  const usgs = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Imagery: USGS (public domain)' });

  const meIcon = L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
  const pinIcon = L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  const markIcon = L.divIcon({ className: '', html: '<div class="pin mark"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  let meMarker = null, accCircle = null, targetMarker = null, markMarker = null, ray = null, markRay = null;

  function redraw() {
    if (!me) return;
    const p = L.latLng(me.lat, me.lng);
    if (!meMarker) { meMarker = L.marker(p, { icon: meIcon, interactive: false }).addTo(map); accCircle = L.circle(p, { radius: me.acc, color: '#184027', weight: 1, fillColor: '#184027', fillOpacity: .12, interactive: false }).addTo(map); }
    else { meMarker.setLatLng(p); accCircle.setLatLng(p); accCircle.setRadius(me.acc); }
    if (target) { if (!targetMarker) targetMarker = L.marker(target, { icon: pinIcon, interactive: false }).addTo(map); else targetMarker.setLatLng(target);
      if (!ray) ray = L.polyline([p, target], { color: '#FFFDD0', weight: 2, dashArray: '2 8', lineCap: 'round', interactive: false }).addTo(map); else ray.setLatLngs([p, target]); }
    if (mark) { if (!markMarker) markMarker = L.marker(mark, { icon: markIcon, interactive: false }).addTo(map); else markMarker.setLatLng(mark);
      if (!markRay) markRay = L.polyline([p, mark], { color: '#E3B278', weight: 2, dashArray: '2 8', lineCap: 'round', interactive: false }).addTo(map); else markRay.setLatLngs([p, mark]); }
    if (target) { $('big').textContent = fmt(p.distanceTo(target)); $('biglbl').textContent = `${unit} to the pin you tapped`; }
    else if (mark) { $('big').textContent = fmt(p.distanceTo(mark)); $('biglbl').textContent = `${unit} from your mark`; }
    else { $('big').textContent = '—'; $('biglbl').textContent = 'tap the map'; }
    const b = target ? bearing(p, target) : (mark ? bearing(p, mark) : null);
    $('fb').innerHTML = `<b>${mark ? fmt(p.distanceTo(mark)) : '—'}</b> from mark<br><b>${b === null ? '—' : Math.round(b) + '° ' + compass(b)}</b> bearing`;
    const chip = $('acc'); chip.textContent = `±${fmt(me.acc)} ${unit}`; chip.className = 'chip ' + (me.acc <= 6 ? 'good' : me.acc <= 15 ? 'ok' : 'bad');
    if (follow) map.setView(p, Math.max(map.getZoom(), 18), { animate: started });
  }
  function onFix(pos) {
    const c = pos.coords;
    me = { lat: c.latitude, lng: c.longitude, acc: c.accuracy || 99, t: pos.timestamp };
    if (!started) { map.setView([me.lat, me.lng], 18); started = true; }
    $('markbtn').disabled = false; $('clearbtn').disabled = !(mark || target);
    $('hint').textContent = target ? '' : (mark ? 'walk — the number is yards back to your mark' : 'tap anything for yards to it');
    const row = document.createElement('div');
    row.innerHTML = `<span>${new Date(me.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span><span>${me.lat.toFixed(6)}, ${me.lng.toFixed(6)}</span><span>±${fmt(me.acc)} ${unit}</span>`;
    const log = $('log'); log.prepend(row); while (log.children.length > 40) log.lastChild.remove();
    redraw();
  }
  function onErr(e) {
    const msg = e.code === 1 ? 'Location is blocked. iPhone: Settings › Privacy › Location Services › Safari Websites → While Using, Precise on. Then reload.' : e.code === 2 ? 'No GPS fix yet — step outside or near a window and wait.' : 'GPS timed out — try again outside.';
    $('err').textContent = msg; $('gate').hidden = false; $('acc').textContent = 'no fix'; $('acc').className = 'chip bad';
  }
  $('start').addEventListener('click', () => {
    if (!('geolocation' in navigator)) { $('err').textContent = 'This browser has no location access.'; return; }
    $('err').textContent = 'asking…';
    navigator.geolocation.watchPosition(p => { $('gate').hidden = true; setTimeout(() => map.invalidateSize(), 50); onFix(p); }, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  });
  map.on('click', e => { if (!me) return; target = e.latlng; $('clearbtn').disabled = false; redraw(); });
  map.on('dragstart', () => { follow = false; $('followbtn').classList.remove('on'); });
  $('followbtn').addEventListener('click', () => { follow = !follow; $('followbtn').classList.toggle('on', follow); redraw(); });
  $('markbtn').addEventListener('click', () => { if (!me) return; mark = L.latLng(me.lat, me.lng); if (targetMarker) { map.removeLayer(targetMarker); targetMarker = null; } if (ray) { map.removeLayer(ray); ray = null; } target = null; $('clearbtn').disabled = false; try { localStorage.setItem('gbmark', JSON.stringify(mark)); } catch (_) {} redraw(); });
  $('clearbtn').addEventListener('click', () => { for (const l of [targetMarker, markMarker, ray, markRay]) if (l) map.removeLayer(l); targetMarker = markMarker = ray = markRay = null; mark = null; target = null; try { localStorage.removeItem('gbmark'); } catch (_) {} $('clearbtn').disabled = true; redraw(); });
  $('unitbtn').addEventListener('click', () => { unit = unit === 'yd' ? 'm' : 'yd'; $('unitbtn').textContent = unit === 'yd' ? 'Yards' : 'Metres'; redraw(); });
  try { const m = JSON.parse(localStorage.getItem('gbmark') || 'null'); if (m && isFinite(m.lat)) mark = L.latLng(m.lat, m.lng); } catch (_) {}
})();
</script>
</body>
</html>
